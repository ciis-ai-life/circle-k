<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffcc00">
  <link rel="manifest" href="manifest.json">
  <title>Circle-K — Control de Caducidades</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif}
    body{background:#f8f9fa; color:#333; padding:1rem; max-width:800px; margin:0 auto}
    .card{background:white; border-radius:12px; padding:1.5rem; margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,.1)}
    h1,h2{color:#222; margin-bottom:1rem}
    input,button,select{width:100%; padding:.8rem; margin:.5rem 0; border:1px solid #ddd; border-radius:8px; font-size:1rem}
    button{background:#ffcc00; border:none; font-weight:bold; cursor:pointer; transition:.2s}
    button:hover{background:#ffc107}
    .btn-danger{background:#e53935; color:white}
    .btn-success{background:#43a047; color:white}
    .hidden{display:none !important}
    .product-item{border-bottom:1px solid #eee; padding:.8rem 0}
    .aviso{padding:.7rem; border-radius:8px; margin:.5rem 0}
    .aviso.alerta{background:#fff3cd; color:#856404}
    .aviso.vencido{background:#f8d7da; color:#721c24}
    .header{display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem}
    .user-info{font-size:.9rem; color:#666}
  </style>
</head>
<body>

<!-- PANTALLA DE INICIO DE SESIÓN -->
<div id="pantalla-login" class="card">
  <h1>🔐 Acceso — Circle-K</h1>
  <input type="email" id="correo" placeholder="Correo electrónico">
  <input type="password" id="clave" placeholder="Contraseña">
  <button onclick="iniciarSesion()">Entrar</button>
  <p style="margin-top:1rem; font-size:.9rem; color:#666;">Solo personal autorizado</p>
  <p id="mensaje-error" style="color:red; margin-top:.5rem;"></p>
</div>

<!-- PANTALLA PRINCIPAL DEL SISTEMA -->
<div id="pantalla-sistema" class="hidden">
  <div class="header">
    <h1>🏪 Control de Caducidades</h1>
    <div>
      <span class="user-info" id="nombre-usuario"></span>
      <button class="btn-danger" style="width:auto; padding:.5rem 1rem; margin-left:.5rem" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>

  <!-- FORMULARIO DE REGISTRO -->
  <div class="card">
    <h2>📝 Registrar Producto</h2>
    <input type="text" id="prod-nombre" placeholder="Nombre del producto" required>
    <input type="text" id="prod-codigo" placeholder="Código / Barras">
    <input type="date" id="prod-caducidad">
    <select id="prod-tipo">
      <option value="normal">Normal</option>
      <option value="ciclico">Cíclico</option>
    </select>
    <button class="btn-success" onclick="registrarProducto()">Guardar Producto</button>
  </div>

  <!-- LISTA DE PRODUCTOS -->
  <div class="card">
    <h2>📋 Productos Registrados</h2>
    <div id="lista-productos"></div>
  </div>

  <!-- ZONA DE ADMINISTRADOR -->
  <div id="zona-admin" class="card hidden">
    <h2>👤 Administración — Agregar Empleado</h2>
    <input type="email" id="nuevo-correo" placeholder="Correo del empleado">
    <input type="password" id="nuevo-clave" placeholder="Contraseña">
    <button onclick="crearEmpleado()">Crear Cuenta</button>
    <p id="msg-admin" style="margin-top:.5rem;"></p>
  </div>
</div>

<script>
// ==============================================
// 🔧 PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
// ==============================================
const firebaseConfig = {
  apiKey: "PON_TU_CLAVE_AQUI",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO_ID",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "TUS_NUMEROS",
  appId: "TU_APP_ID"
};

// INICIALIZAR FIREBASE
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// CORREO DEL ADMINISTRADOR (PON TU CORREO AQUÍ)
const ADMIN_CORREO = "tucorreo@ejemplo.com";

// ==============================================
// 🔐 SESIÓN
// ==============================================
auth.onAuthStateChanged(usuario => {
  if (usuario) {
    document.getElementById('pantalla-login').classList.add('hidden');
    document.getElementById('pantalla-sistema').classList.remove('hidden');
    document.getElementById('nombre-usuario').textContent = usuario.email;
    
    // Mostrar zona de admin solo a ti
    if (usuario.email === ADMIN_CORREO) {
      document.getElementById('zona-admin').classList.remove('hidden');
    }
    
    cargarProductos();
  } else {
    document.getElementById('pantalla-login').classList.remove('hidden');
    document.getElementById('pantalla-sistema').classList.add('hidden');
  }
});

function iniciarSesion() {
  const correo = document.getElementById('correo').value;
  const clave = document.getElementById('clave').value;
  auth.signInWithEmailAndPassword(correo, clave)
    .catch(err => {
      document.getElementById('mensaje-error').textContent = "Error: Verifica correo y contraseña";
      console.error(err);
    });
}

function cerrarSesion() {
  auth.signOut();
}

// ==============================================
// 📦 REGISTRO Y LECTURA DE PRODUCTOS
// ==============================================
function registrarProducto() {
  const usuario = auth.currentUser;
  if (!usuario) return alert("Debes iniciar sesión");

  const nombre = document.getElementById('prod-nombre').value;
  const codigo = document.getElementById('prod-codigo').value;
  const caducidad = document.getElementById('prod-caducidad').value;
  const tipo = document.getElementById('prod-tipo').value;

  if (!nombre || !caducidad) return alert("Faltan datos obligatorios");

  db.collection('productos').add({
    nombre, codigo, caducidad, tipo,
    registradoPor: usuario.email,
    fecha: new Date()
  })
  .then(() => {
    alert("✅ Producto registrado");
    // Limpiar formulario
    document.getElementById('prod-nombre').value = '';
    document.getElementById('prod-codigo').value = '';
    document.getElementById('prod-caducidad').value = '';
  })
  .catch(err => alert("Error: " + err.message));
}

function cargarProductos() {
  db.collection('productos').orderBy('fecha', 'desc').onSnapshot(snapshot => {
    const lista = document.getElementById('lista-productos');
    lista.innerHTML = '';
    
    snapshot.forEach(doc => {
      const p = doc.data();
      const hoy = new Date();
      const fechaCad = new Date(p.caducidad);
      const dias = Math.ceil((fechaCad - hoy) / (1000*60*60*24));
      
      let clase = '';
      let etiqueta = '';
      if (dias < 0) { clase = 'vencido'; etiqueta = '⚠️ VENCIDO'; }
      else if (dias <= 7) { clase = 'alerta'; etiqueta = '⏰ Próximo'; }
      
      lista.innerHTML += `
        <div class="product-item">
          <strong>${p.nombre}</strong> — ${p.codigo || 'Sin código'}
          <br>
          Caducidad: ${p.caducidad} | ${p.tipo === 'ciclico' ? '🔄 Cíclico' : 'Normal'}
          ${clase ? `<div class="aviso ${clase}">${etiqueta} — ${dias < 0 ? 'Hace ' + Math.abs(dias) + ' días' : 'Faltan ' + dias + ' días'}</div>` : ''}
          <small>Registrado por: ${p.registradoPor}</small>
        </div>
      `;
    });
  });
}

// ==============================================
// 👤 CREAR EMPLEADOS (SOLO ADMIN)
// ==============================================
function crearEmpleado() {
  const admin = auth.currentUser;
  if (!admin || admin.email !== ADMIN_CORREO) return;

  const correo = document.getElementById('nuevo-correo').value;
  const clave = document.getElementById('nuevo-clave').value;

  fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyBk-XXXXXXXXXXXXXXXXXXXXXXXXXXXX', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: correo, password: clave, returnSecureToken: true})
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) throw new Error(data.error.message);
    document.getElementById('msg-admin').innerHTML = `<span style="color:green">✅ Cuenta creada para: ${correo}</span>`;
    document.getElementById('nuevo-correo').value = '';
    document.getElementById('nuevo-clave').value = '';
  })
  .catch(err => {
    document.getElementById('msg-admin').innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
  });
}
</script>
</body>
  </html>
