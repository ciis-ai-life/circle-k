<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle-K — Control de Inventarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #ffcc00; --sec: #000; --ok: #2e7d32; --warn: #f57c00; --danger: #d32f2f; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f8f9fa; padding-bottom: 80px; margin: 0; }
        
        /* --- PANTALLA DE ACCESO --- */
        .pantalla-acceso {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .tarjeta-acceso {
            background: white; padding: 2.5rem; border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1); width: 100%; max-width: 420px;
        }
        .tarjeta-acceso h1 { text-align: center; margin-bottom: 2rem; font-size: 1.7rem; }
        .tarjeta-acceso input {
            width: 100%; padding: 0.9rem; margin-bottom: 1rem;
            border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;
        }
        .btn-entrar {
            width: 100%; padding: 1rem; background: var(--primary);
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; color: #000; transition: background 0.2s;
        }
        .btn-entrar:hover { background: #ffb900; }
        .btn-entrar:disabled { opacity: 0.6; cursor: not-allowed; }
        .mensaje { min-height: 1.6rem; margin-top: 1rem; text-align: center; font-weight: 500; }
        .error { color: var(--danger); }
        .ok { color: var(--ok); }

        /* --- PANTALLA DE INVENTARIO (oculta al inicio) --- */
        .pantalla-inventario { display: none; }
        .alerta-vencimiento { background: #fff3e0; border-left: 4px solid var(--warn); }
        .alerta-stock { background: #ffebee; border-left: 4px solid var(--danger); }
        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1); padding: 0.6rem; z-index: 100;
        }
        .card { border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 1rem; }
        #lector { max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body>

<!-- ================== PANTALLA DE ACCESO ================== -->
<div class="pantalla-acceso" id="pantallaAcceso">
    <div class="tarjeta-acceso">
        <h1>🔐 Acceso — Circle-K</h1>
        <input type="email" id="correo" value="xavidgeffen@gmail.com" placeholder="Correo electrónico">
        <input type="password" id="clave" placeholder="Contraseña">
        <button class="btn-entrar" id="btnEntrar">Entrar</button>
        <div class="mensaje" id="mensaje"></div>
        <p class="text-center text-muted small mt-3">Solo personal autorizado</p>
    </div>
</div>

<!-- ================== PANTALLA DE INVENTARIO ================== -->
<div class="pantalla-inventario" id="pantallaInventario">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="navbar-brand mb-0 fs-4">📦 Inventario Circle-K</h1>
            <button id="btnSalir" class="btn btn-outline-light btn-sm">Salir</button>
        </div>
    </nav>

    <div class="container">
        <ul class="nav nav-tabs mb-3" id="pestanas">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#lista">Lista</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#agregar">Agregar</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#escanear">Escanear</button></li>
        </ul>

        <div class="tab-content">
            <!-- Lista -->
            <div class="tab-pane fade show active" id="lista">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <input type="text" id="buscar" class="form-control" placeholder="🔍 Buscar producto...">
                    </div>
                    <div class="col-md-4">
                        <select id="filtro" class="form-select">
                            <option value="todos">Todos</option>
                            <option value="bajo">Stock bajo</option>
                            <option value="vencen">Por caducar</option>
                        </select>
                    </div>
                </div>
                <div id="contenedorLista"></div>
            </div>

            <!-- Agregar -->
            <div class="tab-pane fade" id="agregar">
                <div class="card p-3">
                    <h5 class="mb-3">➕ Nuevo Producto</h5>
                    <form id="formProducto">
                        <div class="mb-2">
                            <label class="form-label">Código de barras</label>
                            <input type="text" id="codigo" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option>Bebidas</option><option>Alimentos</option><option>Snacks</option>
                                <option>Limpieza</option><option>Higiene</option><option>Otros</option>
                            </select>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <label class="form-label">Cantidad</label>
                                <input type="number" id="cantidad" class="form-control" min="0" required>
                            </div>
                            <div class="col">
                                <label class="form-label">Precio ($ MXN)</label>
                                <input type="number" id="precio" class="form-control" step="0.01" min="0" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Fecha de entrada</label>
                                <input type="date" id="fechaEntrada" class="form-control">
                            </div>
                            <div class="col">
                                <label class="form-label">Fecha de caducidad</label>
                                <input type="date" id="fechaCaducidad" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>

            <!-- Escanear -->
            <div class="tab-pane fade" id="escanear">
                <div class="card p-3 text-center">
                    <h5 class="mb-3">📷 Escanear Código</h5>
                    <div id="lector"></div>
                    <button id="iniciarCamara" class="btn btn-primary mt-2">Activar Cámara</button>
                    <button id="detenerCamara" class="btn btn-secondary mt-2 d-none">Detener</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// =====================================================
// 🔑 CONFIGURACIÓN DE ACCESO Y CONEXIÓN
// =====================================================
const CREDENCIALES = {
    correo: 'xavidgeffen@gmail.com',
    contrasena: 'Geffen$666&'
};

// Pega aquí tus datos de Supabase (ve a Settings → API en tu proyecto)
const SUPABASE_URL = 'https://TU-URL.supabase.co';
const SUPABASE_KEY = 'TU-CLAVE-ANON';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Umbrales de alerta
const UMBRAL_STOCK_BAJO = 5;
const DIAS_AVISO_CADUCIDAD = 7;

// =====================================================
// 🚀 INICIO — COMPROBAR SESIÓN Y MOSTRAR PANTALLA
// =====================================================
const pantallaAcceso = document.getElementById('pantallaAcceso');
const pantallaInventario = document.getElementById('pantallaInventario');
const btnEntrar = document.getElementById('btnEntrar');
const btnSalir = document.getElementById('btnSalir');
const correoInput = document.getElementById('correo');
const claveInput = document.getElementById('clave');
const mensaje = document.getElementById('mensaje');

// ¿Ya tiene sesión activa?
if (localStorage.getItem('circlek_acceso') === 'autorizado') {
    mostrarInventario();
}

// Eventos del botón de acceso
btnEntrar.addEventListener('click', validarAcceso);
claveInput.addEventListener('keydown', e => e.key === 'Enter' && validarAcceso());
btnSalir.addEventListener('click', cerrarSesion);

// =====================================================
// 🔐 LÓGICA DE ACCESO
// =====================================================
function validarAcceso() {
    const correo = correoInput.value.trim();
    const clave = claveInput.value;

    if (!correo || !clave) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = '⚠️ Escribe la contraseña';
        return;
    }

    // Comparación EXACTA — no hay errores de espacios ni mayúsculas
    if (correo === CREDENCIALES.correo && clave === CREDENCIALES.contrasena) {
        mensaje.className = 'mensaje ok';
        mensaje.textContent = '✅ Acceso concedido...';
        btnEntrar.disabled = true;

        localStorage.setItem('circlek_acceso', 'autorizado');
        localStorage.setItem('circlek_usuario', correo);

        setTimeout(mostrarInventario, 600);
    } else {
        mensaje.className = 'mensaje error';
        mensaje.textContent = '❌ Contraseña incorrecta';
        claveInput.value = '';
        claveInput.focus();
    }
}

function mostrarInventario() {
    pantallaAcceso.style.display = 'none';
    pantallaInventario.style.display = 'block';
    cargarProductos();
    document.getElementById('fechaEntrada').valueAsDate = new Date();
}

function cerrarSesion() {
    localStorage.removeItem('circlek_acceso');
    localStorage.removeItem('circlek_usuario');
    pantallaInventario.style.display = 'none';
    pantallaAcceso.style.display = 'flex';
    btnEntrar.disabled = false;
    mensaje.textContent = '';
    claveInput.value = '';
}

// =====================================================
// 📦 LÓGICA DE INVENTARIO
// =====================================================
let inventario = [];
let lectorCamara = null;

// Cargar desde Supabase
async function cargarProductos() {
    const { data, error } = await supabase
        .from('productos')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) {
        console.error('Error al cargar:', error);
        return;
    }
    inventario = data || [];
    renderizarLista();
}

// Guardar producto
document.getElementById('formProducto').addEventListener('submit', async e => {
    e.preventDefault();
    const codigo = document.getElementById('codigo').value.trim();
    
    const datos = {
        codigo,
        nombre: document.getElementById('nombre').value.trim(),
        categoria: document.getElementById('categoria').value,
        cantidad: parseInt(document.getElementById('cantidad').value),
        precio: parseFloat(document.getElementById('precio').value),
        fecha_entrada: document.getElementById('fechaEntrada').value,
        fecha_caducidad: document.getElementById('fechaCaducidad').value
    };

    // ¿Existe? Actualizar / Insertar
    const existe = inventario.find(p => p.codigo === codigo);
    let respuesta;

    if (existe) {
        respuesta = await supabase
            .from('productos')
            .update(datos)
            .eq('codigo', codigo)
            .select();
    } else {
        respuesta = await supabase
            .from('productos')
            .insert(datos)
            .select();
    }

    if (respuesta.error) {
        alert('Error: ' + respuesta.error.message);
        return;
    }

    alert(existe ? '✅ Producto actualizado' : '✅ Producto agregado');
    e.target.reset();
    document.getElementById('fechaEntrada').valueAsDate = new Date();
    cargarProductos();
});

// Renderizar lista
function renderizarLista() {
    const buscar = document.getElementById('buscar').value.toLowerCase();
    const filtro = document.getElementById('filtro').value;

    const filtrados = inventario.filter(p => {
        const coincide = p.nombre.toLowerCase().includes(buscar) || p.codigo.includes(buscar);
        if (!coincide) return false;
        if (filtro === 'bajo') return p.cantidad <= UMBRAL_STOCK_BAJO;
        if (filtro === 'vencen') {
            const dr = diasRestantes(p.fecha_caducidad);
            return dr !== null && dr <= DIAS_AVISO_CADUCIDAD && dr >= 0;
        }
        return true;
    });

    const contenedor = document.getElementById('contenedorLista');
    if (!filtrados.length) {
        contenedor.innerHTML = '<p class="text-center text-muted mt-4">No hay productos registrados</p>';
        return;
    }

    contenedor.innerHTML = filtrados.map(p => {
        const dr = diasRestantes(p.fecha_caducidad);
        let clases = '', etiquetas = '';
        if (p.cantidad <= UMBRAL_STOCK_BAJO) {
            clases += ' alerta-stock';
            etiquetas += `<span class="badge bg-danger me-1">Stock bajo</span>`;
        }
        if (dr !== null && dr <= DIAS_AVISO_CADUCIDAD && dr >= 0) {
            clases += ' alerta-vencimiento';
            etiquetas += `<span class="badge bg-warning text-dark">Vence en
