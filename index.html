<title>Cíclicos Circle K — Control de Caducidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fefcf8; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --accent:#ea580c; --accent-soft:rgba(234,88,12,.14);
  --accent2:#16a34a; --accent2-soft:rgba(22,163,74,.14);
  --border:rgba(15,23,42,.08);
  --danger:#dc2626; --danger-soft:rgba(220,38,38,.10);
  --warn:#d97706; --warn-soft:rgba(217,119,6,.12);
  --ok:#16a34a; --ok-soft:rgba(22,163,74,.12);
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 6px 20px rgba(15,23,42,.05);
  --radius:16px;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Quicksand',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.45;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  min-height:100vh;
}
.app{max-width:560px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(135deg,#ea580c,#f97316);
  color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  box-shadow:0 2px 12px rgba(234,88,12,.25);
}
header.top .row{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px}
header.top .sub{font-size:12px;opacity:.9;font-weight:500}
header.top .spacer{flex:1}
.iconbtn{
  background:rgba(255,255,255,.18); border:none; color:#fff;
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.iconbtn:active{transform:scale(.94)}
h2.sec{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:22px 4px 10px}
/* KPI cards */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow);
}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.kpi.warn{border-color:var(--warn); background:var(--warn-soft)}
.kpi.danger{border-color:var(--danger); background:var(--danger-soft)}
/* cards */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.pcard{display:flex;gap:12px;padding:12px;align-items:center;cursor:pointer}
.pcard:active{background:#fff7ed}
.pcard .thumb{
  width:64px;height:64px;border-radius:12px;flex-shrink:0;
  background:var(--accent-soft); display:flex;align-items:center;justify-content:center;
  overflow:hidden; color:var(--accent);
}
.pcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .info{flex:1;min-width:0}
.pcard .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pcard .qty{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);font-size:15px;text-align:right}
.pcard .exp{font-size:11px;margin-top:3px;text-align:right;font-weight:600}
/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.expired{background:var(--danger-soft);color:var(--danger)}
.pill.cat{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(234,88,12,.25)}
/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;width:100%;
  transition:transform .08s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(234,88,12,.35)}
.btn.primary2{background:var(--accent2);color:#fff;box-shadow:0 4px 14px rgba(22,163,74,.3)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(220,38,38,.25)}
.btn.small{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}
/* search */
.search{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:11px 14px;margin-top:14px;
  box-shadow:var(--shadow);
}
.search input{border:none;outline:none;flex:1;font-family:inherit;font-size:15px;background:transparent;color:var(--text)}
.search svg{color:var(--muted);flex-shrink:0}
/* bottom nav */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom .inner{max-width:560px;margin:0 auto;display:flex;align-items:stretch;height:var(--nav-h)}
nav.bottom .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;cursor:pointer;color:var(--muted);font-family:inherit;
  font-size:11px;font-weight:700;padding:6px 0;
}
nav.bottom .tab.active{color:var(--accent)}
nav.bottom .fab{
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  margin-top:-22px;box-shadow:0 6px 18px rgba(234,88,12,.45);
}
nav.bottom .fab:active{transform:scale(.93)}
/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet .handle{width:44px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:700}
.sheet .hint{font-size:12.5px;color:var(--muted);margin-bottom:14px}
label.field{display:block;margin-bottom:12px}
label.field span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
label.field input, label.field select, label.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;
  font-family:inherit;font-size:15px;background:var(--card);color:var(--text);outline:none;
}
label.field input:focus, label.field select:focus, label.field textarea:focus{border-color:var(--accent)}
label.field textarea{resize:vertical;min-height:60px}
/* photo picker */
.photobox{
  border:2px dashed rgba(234,88,12,.4);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;
  margin-bottom:14px; position:relative; overflow:hidden; min-height:120px;
  justify-content:center;
}
.photobox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photobox .over{position:relative;z-index:2;background:rgba(15,23,42,.55);color:#fff;padding:6px 12px;border-radius:99px;font-size:12px}
/* detail photo big */
.detailphoto{
  width:100%;height:230px;object-fit:cover;display:block;cursor:zoom-in;
  background:var(--accent-soft);
}
.detailphoto.nophoto{display:flex;align-items:center;justify-content:center;color:var(--accent);flex-direction:column;gap:8px;font-weight:700;font-size:13px}
/* lot rows */
.lotrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--border)}
.lotrow:first-of-type{border-top:none}
.lotrow .date{font-weight:700;font-variant-numeric:tabular-nums}
.lotrow .days{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.lotrow .qty{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.lotrow .loc{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.delbtn{background:none;border:none;color:var(--danger);cursor:pointer;padding:6px;display:flex}
/* alert row */
.alertrow{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-top:1px solid var(--border)}
.alertrow:first-of-type{border-top:none}
.alertrow .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alertrow .ic.soon{background:var(--warn-soft);color:var(--warn)}
.alertrow .ic.expired{background:var(--danger-soft);color:var(--danger)}
.alertrow .an{flex:1;min-width:0}
.alertrow .an .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alertrow .an .dt{font-size:12px;color:var(--muted);margin-top:1px}
.alertrow .aq{font-weight:700;font-variant-numeric:tabular-nums}
/* movements */
.movrow{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--border);font-size:13px}
.movrow:first-of-type{border-top:none}
.movrow .t{font-weight:700}
.movrow .t.in{color:var(--ok)} .movrow .t.out{color:var(--danger)}
.movrow .d{color:var(--muted);font-size:11.5px;margin-top:1px}
.movrow .q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
/* empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;display:flex;justify-content:center;color:var(--accent)}
.empty p{margin:4px 0;font-size:14px}
/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;
  z-index:200;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* photo viewer */
#viewer{position:fixed;inset:0;background:#000;z-index:300;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#viewer.show{display:flex}
#viewer img{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
#viewer .closev{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:310;background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
#viewer .cap{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12.5px;font-weight:600;z-index:310;pointer-events:none}
/* scanner */
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:240px}
.qr-hidden{display:none}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px;border-top:1px solid var(--border)}
.setrow:first-of-type{border-top:none}
.setrow .sl{font-weight:600;font-size:14px}
.setrow .sd{font-size:12px;color:var(--muted);margin-top:2px}
.setrow input[type=number]{width:70px;border:1.5px solid var(--border);border-radius:10px;padding:8px;text-align:center;font-family:inherit;font-size:15px;font-weight:700}
.backbtn{background:none;border:none;color:#fff;display:flex;align-items:center;gap:6px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:6px 8px;border-radius:10px}
.backbtn:active{background:rgba(255,255,255,.15)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.section-title h2{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--border);margin:14px 0}
.muted{color:var(--muted);font-size:12.5px}
.badge-count{background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px;text-align:center;position:absolute;top:4px;right:calc(50% - 26px)}
.tabwrap{position:relative}
.toggle{position:relative;width:44px;height:24px;border-radius:99px;background:rgba(15,23,42,.18);cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent2)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on::after{left:22px}
.codebox{width:100%;height:170px;border:1.5px solid var(--border);border-radius:12px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;line-height:1.5;background:#0f172a;color:#e2e8f0;resize:vertical;white-space:pre;overflow:auto;tab-size:2}
.sync-status{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
.sync-status.ok{color:var(--ok)}
.progbar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:6px}
.progbar>div{height:100%;background:var(--accent2);transition:width .3s}
.cathead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px;padding:0 4px}
</style>
</head>

<script>
(function(){
'use strict';

/* ================= DB (IndexedDB) ================= */
var DB_NAME='stockLotesDBv1', DB_VER=2;
var db=null;
function openDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('products')){
        var p=d.createObjectStore('products',{keyPath:'id'});
        p.createIndex('barcode','barcode',{unique:false});
      }
      if(!d.objectStoreNames.contains('lots')){
        var l=d.createObjectStore('lots',{keyPath:'id'});
        l.createIndex('productId','productId',{unique:false});
      }
      if(!d.objectStoreNames.contains('movements')){
        var m=d.createObjectStore('movements',{keyPath:'id'});
        m.createIndex('productId','productId',{unique:false});
      }
      if(!d.objectStoreNames.contains('cyclics')){ d.createObjectStore('cyclics',{keyPath:'id'}); }
    };
    r.onsuccess=function(e){res(e.target.result);};
    r.onerror=function(e){rej(e.target.error);};
  });
}
function store(name,mode){ return db.transaction(name,mode).objectStore(name); }
function req2p(req){ return new Promise(function(res,rej){ req.onsuccess=function(e){res(e.target.result);}; req.onerror=function(e){rej(e.target.error);}; }); }
function getAll(name){ return req2p(store(name,'readonly').getAll()); }
function getOne(name,id){ return req2p(store(name,'readonly').get(id)); }
function putOne(name,obj){ return req2p(store(name,'readwrite').put(obj)); }
function delOne(name,id){ return req2p(store(name,'readwrite').delete(id)); }

/* ================= STATE ================= */
var products=[], lots=[], movements=[];
var currentView='home', currentProductId=null;
var alertDays=parseInt(localStorage.getItem('alertDays')||'7',10)||7;
var pendingPhoto=null; // dataURL in product form
var CATEGORIES=['Bebidas','Snacks y Dulces','Lácteos','Alimentos','Panadería','Tabaco','Cuidado Personal','Limpieza','Otros'];
var UNITS=['pza','paq','caja','L','kg','six-pack'];

/* ================= HELPERS ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function fmtDate(iso){
  if(!iso) return 'Sin caducidad';
  var d=new Date(iso);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
}
function daysUntil(iso){
  if(!iso) return Infinity;
  var t=new Date(); t.setHours(0,0,0,0);
  var d=new Date(iso); d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function lotStatus(lot){
  var d=daysUntil(lot.expirationDate);
  if(d<0) return 'expired';
  if(d<=alertDays) return 'soon';
  return 'ok';
}
function statusLabel(s){
  if(s==='expired') return 'Caducado';
  if(s==='soon') return 'Por caducar';
  return 'Vigente';
}
function totalQty(pid){
  return lots.filter(function(l){return l.productId===pid;}).reduce(function(s,l){return s+(+l.quantity||0);},0);
}
function productLots(pid){
  return lots.filter(function(l){return l.productId===pid;})
    .sort(function(a,b){ return (a.expirationDate||'9999-12-31') < (b.expirationDate||'9999-12-31') ? -1 : 1; });
}
function activeLots(pid){ return productLots(pid).filter(function(l){return l.quantity>0;}); }
function soonestExpiry(pid){
  var ls=activeLots(pid).filter(function(l){return l.expirationDate;});
  return ls.length? ls[0].expirationDate : null;
}
function productById(id){ for(var i=0;i<products.length;i++) if(products[i].id===id) return products[i]; return null; }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function fmtQty(n){ return (Math.round(n*100)/100).toString(); }
function fmtDateTime(iso){
  if(!iso) return '';
  var d=new Date(iso);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}

/* ================= TOAST ================= */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2400);
}

/* ================= OVERLAY / MODAL ================= */
function openOverlay(id){ document.getElementById(id).classList.add('show'); document.body.style.overflow='hidden'; }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); document.body.style.overflow=''; }
document.querySelectorAll('.overlay').forEach(function(ov){
  ov.addEventListener('click',function(e){ if(e.target===ov){ closeOverlay(ov.id); if(ov.id==='addOverlay') stopScannerIfAny(); } });
});
function confirmDlg(title,msg,yesLabel,onYes){
  var s=document.getElementById('modalSheet');
  s.innerHTML='<div class="handle"></div><h3>'+title+'</h3><p class="hint" style="font-size:14px;color:var(--text);white-space:pre-line">'+msg+'</p>'+
    '<div class="btn-row"><button class="btn ghost" id="cfNo">Cancelar</button><button class="btn danger" id="cfYes">'+yesLabel+'</button></div>';
  openOverlay('modalOverlay');
  document.getElementById('cfNo').onclick=function(){closeOverlay('modalOverlay');};
  document.getElementById('cfYes').onclick=function(){closeOverlay('modalOverlay');onYes();};
}

/* ================= IMAGE RESIZE ================= */
function resizeImage(file,maxDim,quality){
  return new Promise(function(res){
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(!b){res(null);return;}
        var fr=new FileReader();
        fr.onload=function(){res(fr.result);};
        fr.readAsDataURL(b);
      },'image/jpeg',quality);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}

/* ================= OPEN FOOD FACTS LOOKUP ================= */
function mapCategory(cats){
  var c=(cats||'').toLowerCase();
  if(/beb|drink|beverage|agua|refresco|jugo|soda|beer|cerve|coffee|café|té|tea/.test(c)) return 'Bebidas';
  if(/snack|chip|dulce|candy|chocolate|gallet|confec|botana/.test(c)) return 'Snacks y Dulces';
  if(/milk|lact|yogur|cheese|queso|leche|dairy/.test(c)) return 'Lácteos';
  if(/bread|pan|bakery|pastel/.test(c)) return 'Panadería';
  if(/tobacco|cigarr/.test(c)) return 'Tabaco';
  if(/cosmetic|care|higiene|soap|dental|shampoo/.test(c)) return 'Cuidado Personal';
  if(/clean|detergent|limp/.test(c)) return 'Limpieza';
  if(/food|meal|pizza|sandwich|noodle|soup|salsa|condiment|tuna|atun|frijol|enlatado/.test(c)) return 'Alimentos';
  return 'Otros';
}
async function lookupBarcode(code){
  if(!code || code.length<6) return null;
  try{
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,categories,image_url',
      {headers:{'User-Agent':'StockLotes-App/1.0 (contact: store manager)'}});
    var j=await r.json();
    if(j && j.status===1 && j.product){
      var p=j.product;
      var brand=(p.brands||'').split(',')[0].trim();
      var name=(brand? brand+' ':'')+(p.product_name||'');
      return {name:name.trim()||null, category:mapCategory(p.categories||''), image:p.image_url||null};
    }
  }catch(e){}
  return null;
}

/* ================= RENDER ================= */
var main=document.getElementById('main');

function svgIcon(paths,size){ return '<svg width="'+(size||20)+'" height="'+(size||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>'; }

function alertLots(){
  var out=[];
  lots.forEach(function(l){
    if(l.quantity<=0) return;
    var s=lotStatus(l);
    if(s!=='ok'){ out.push({lot:l,product:productById(l.productId),status:s,days:daysUntil(l.expirationDate)}); }
  });
  out.sort(function(a,b){ return a.days-b.days; });
  return out;
}

function updateBadge(){
  var n=alertLots().length;
  var b=document.getElementById('alertBadge');
  if(!b) return;
  if(n>0){ b.style.display='inline-block'; b.textContent=n; } else b.style.display='none';
}

      h+='<div class="alertrow" data-pid="'+a.product.id+'">';
      h+='<div class="ic '+a.status+'">'+svgIcon(I.alert)+'</div>';
      h+='<div class="an"><div class="nm">'+(a.product? escapeHtml(a.product.name):'Producto')+'</div><div class="dt">'+fmtDate(a.lot.expirationDate)+' · '+dtxt+'</div></div>';
      h+='<div class="aq">'+fmtQty(a.lot.quantity)+' '+(a.product?a.product.unit:'pza')+'</div>';
      h+='</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="empty"><div class="big">'+svgIcon(I.check,44)+'</div><p><strong>¡Todo en orden!</strong></p><p>No hay productos próximos a caducar.</p></div>';
  }
  main.innerHTML=h;
  document.getElementById('homeAdd').onclick=openAddFlow;
  main.querySelectorAll('.alertrow').forEach(function(r){
    r.onclick=function(){ openDetail(r.getAttribute('data-pid')); };
  });
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}

var searchFilter='';
function renderProducts(){
  var f=searchFilter.trim().toLowerCase();
  var list=products.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'','es');});
  if(f) list=list.filter(function(p){ return (p.name||'').toLowerCase().indexOf(f)>=0 || (p.barcode||'').indexOf(f)>=0 || (p.category||'').toLowerCase().indexOf(f)>=0; });
  var h='<div class="search">'+svgIcon(I.search)+'<input id="prodSearch" placeholder="Buscar por nombre, código o categoría..." value="'+escapeHtml(searchFilter)+'"></div>';
  h+='<div class="section-title"><h2>Productos</h2><span class="muted">'+list.length+'</span></div>';
  if(!list.length){
    h+='<div class="empty"><div class="big">'+svgIcon(I.box,44)+'</div><p><strong>Sin productos</strong></p><p>Toca el botón + para registrar tu primer producto.</p></div>';
  } else {
    h+='<div class="list">';
    list.forEach(function(p){
      var tq=totalQty(p.id);
      var se=soonestExpiry(p.id);
      var st= se? (daysUntil(se)<0?'expired':(daysUntil(se)<=alertDays?'soon':'ok')) : 'ok';
      var dtxt= se? (daysUntil(se)<0? 'Caducado':(daysUntil(se)===0?'Caduca hoy':'Vence '+fmtDate(se))) : 'Sin caducidad';
      h+='<div class="card pcard" data-pid="'+p.id+'">';
      h+='<div class="thumb">'+(p.photo? '<img src="'+p.photo+'" alt="'+escapeHtml(p.name)+'">': svgIcon(I.image,28))+'</div>';
      h+='<div class="info"><div class="name">'+escapeHtml(p.name)+'</div>';
      h+='<div class="meta">'+(p.barcode? '#'+escapeHtml(p.barcode)+' · ':'')+escapeHtml(p.category||'Otros')+'</div></div>';
      h+='<div><div class="qty">'+fmtQty(tq)+' '+escapeHtml(p.unit||'pza')+'</div><div class="exp" style="color:'+(st==='expired'?'var(--danger)':st==='soon'?'var(--warn)':'var(--muted)')+'">'+dtxt+'</div></div>';
      h+='</div>';
    });
    h+='</div>';
  }
  main.innerHTML=h;
  var si=document.getElementById('prodSearch');
  si.focus();
  si.addEventListener('input',function(){ searchFilter=si.value; renderProducts(); });
  main.querySelectorAll('.pcard').forEach(function(c){ c.onclick=function(){ openDetail(c.getAttribute('data-pid')); }; });
}

function renderAlerts(){
  var al=alertLots();
  var h='<div class="section-title"><h2>Alertas de caducidad</h2><span class="muted">Umbral: '+alertDays+' días</span></div>';
  if(!al.length){
    h+='<div class="empty"><div class="big">'+svgIcon(I.check,44)+'</div><p><strong>Sin alertas</strong></p><p>Todos los lotes están vigentes.</p></div>';
  } else {
    h+='<div class="card">';
    al.forEach(function(a){
      var dtxt=a.days<0? ('Caducado hace '+Math.abs(a.days)+' día(s)') : (a.days===0? 'Caduca hoy' : 'Caduca en '+a.days+' día(s)');
      h+='<div class="alertrow" data-pid="'+a.product.id+'">';
      h+='<div class="ic '+a.status+'">'+svgIcon(I.alert)+'</div>';
      h+='<div class="an"><div class="nm">'+escapeHtml(a.product? a.product.name:'Producto')+'</div><div class="dt">Lote vence '+fmtDate(a.lot.expirationDate)+' · '+dtxt+(a.lot.location?' · '+escapeHtml(a.lot.location):'')+'</div></div>';
      h+='<div class="aq">'+fmtQty(a.lot.quantity)+' '+(a.product?escapeHtml(a.product.unit):'pza')+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  main.innerHTML=h;
  main.querySelectorAll('.alertrow').forEach(function(r){ r.onclick=function(){ openDetail(r.getAttribute('data-pid')); }; });
}

bQZ3k2Rnnu0EREADClXmNFdDfobtz8at1Vl4cjToE7AFnxdOckCwIGKCc1hmBNyBosv/9k=" alt="Circle K" style="height:54px;width:auto;display:block;margin:0 auto 12px">';
  h+='<div style="font-weight:700;font-size:15px;line-height:1.35">Aplicación desarrollada para elaboración de cíclicos de Circle K y control de caducidades</div>';

    try{ document.execCommand('copy'); toast('Código copiado'); }catch(e){
      navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(function(){toast('Código copiado');}).catch(function(){toast('Selecciona el texto y copia manualmente');});
    }
  };
  var sui=document.getElementById('syncUrlInput');
  sui.addEventListener('change',function(){ syncUrl=sui.value.trim(); localStorage.setItem('syncUrl',syncUrl); toast('URL guardada'); });
  document.getElementById('autoSyncToggle').onclick=function(){
    autoSync=!autoSync; this.classList.toggle('on',autoSync); localStorage.setItem('autoSync',autoSync?'1':'0');
    toast(autoSync?'Sincronización automática activada':'Sincronización automática desactivada');
    if(autoSync) scheduleAutoUpload();
  };
  document.getElementById('syncTest').onclick=async function(){
    if(!syncUrl){toast('Pega primero la URL del puente');return;}
    var orig=this.textContent; this.textContent='Probando...'; this.disabled=true;
    try{ var d=await cloudDownload(); var s=document.getElementById('syncStatus'); s.textContent= d? 'Conexión OK · se encontró un respaldo' : 'Conexión OK · aún sin respaldo'; s.className='sync-status ok'; toast('Conexión exitosa'); }
    catch(e){ var s2=document.getElementById('syncStatus'); s2.textContent='Error de conexión: '+e.message; s2.className='sync-status'; toast('No se pudo conectar'); }

    var orig=this.textContent; this.textContent='Subiendo...'; this.disabled=true;
    try{ await cloudUpload(); var s=document.getElementById('syncStatus'); s.textContent='Respaldado en Drive: '+fmtDateTime(lastSync); s.className='sync-status ok'; toast('Respaldado en Google Drive'); }
    catch(e){ toast('Error al subir: '+e.message); }
    this.textContent=orig; this.disabled=false;
  };
  document.getElementById('syncDown').onclick=async function(){
    if(!syncUrl){toast('Pega primero la URL del puente');return;}
    var orig=this.textContent; this.textContent='Descargando...'; this.disabled=true;
    try{
      var data=await cloudDownload();
      if(!data){ toast('No hay respaldo guardado en Drive'); this.textContent=orig; this.disabled=false; return; }
      this.textContent=orig; this.disabled=false;
      confirmDlg('Restaurar desde Drive','Se reemplazarán los datos de este teléfono con el respaldo de Google Drive ('+(data.products?data.products.length:0)+' productos).','Restaurar',async function(){
        await wipeAllSilent();
        for(var i=0;i<data.products.length;i++) await putOne('products',data.products[i]);
        for(var j=0;j<data.lots.length;j++) await putOne('lots',data.lots[j]);
        if(data.movements) for(var k=0;k<data.movements.length;k++) await putOne('movements',data.movements[k]);
        if(data.alertDays){ alertDays=data.alertDays; localStorage.setItem('alertDays',String(alertDays)); }
        await refresh();
        toast('Datos restaurados de Google Drive');
        showView('home');
      });
    }catch(e){ toast('Error al descargar: '+e.message); this.textContent=orig; this.disabled=false; }
  };
}

function openDetail(pid){
  currentProductId=pid;
  currentView='detail';
  document.getElementById('backBtn').style.display='flex';
  document.querySelectorAll('nav.bottom .tab').forEach(function(t){t.classList.remove('active');});
  renderDetail();
  window.scrollTo(0,0);
}

function renderDetail(){
  var p=productById(currentProductId);
  if(!p){ showView('products'); return; }
  document.getElementById('topTitle').textContent=p.name;
  document.getElementById('topSub').textContent=(p.barcode? 'Código: '+p.barcode+' · ':'')+(p.category||'');
  var ls=productLots(p.id);
  var tq=totalQty(p.id);
  var movs=movements.filter(function(m){return m.productId===p.id;}).sort(function(a,b){return b.ts-a.ts;}).slice(0,10);
  var h='';
  if(p.photo){
    h+='<div style="margin-top:14px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)"><img class="detailphoto" id="detailPhoto" src="'+p.photo+'" alt="'+escapeHtml(p.name)+'"></div>';
  } else {
    h+='<div class="detailphoto nophoto" id="detailPhoto" style="margin-top:14px;border-radius:18px;box-shadow:var(--shadow)">'+svgIcon(I.camera,36)+'<span>Sin foto · toca para agregar</span></div>';
  }
  h+='<div class="kpis" style="grid-template-columns:1fr 1fr 1fr;margin-top:12px">';
  h+='<div class="kpi" style="padding:10px"><div class="n" style="font-size:20px">'+fmtQty(tq)+'</div><div class="l">Existencia ('+escapeHtml(p.unit||'pza')+')</div></div>';
  h+='<div class="kpi" style="padding:10px"><div class="n" style="font-size:20px">'+activeLots(p.id).length+'</div><div class="l">Lotes activos</div></div>';
  var se=soonestExpiry(p.id);
  h+='<div class="kpi" style="padding:10px"><div class="n" style="font-size:13px;font-weight:700;margin-top:4px">'+(se? fmtDate(se):'—')+'</div><div class="l">Próx. vencimiento</div></div>';
  h+='</div>';

  h+='<div class="btn-row"><button class="btn primary2" id="addLotBtn">'+svgIcon(I.plus,18)+'Entrada (lote)</button><button class="btn primary" id="outBtn">'+svgIcon(I.minus,18)+'Salida</button></div>';
  h+='<div class="btn-row"><button class="btn ghost" id="editBtn">'+svgIcon(I.edit,16)+'Editar producto</button><button class="btn ghost" id="delBtn" style="color:var(--danger)">'+svgIcon(I.trash,16)+'Eliminar</button></div>';

  h+='<div class="section-title"><h2>Lotes (por caducidad)</h2></div>';
  if(!ls.length){
    h+='<div class="card" style="padding:18px;text-align:center;color:var(--muted)">Sin lotes registrados. Toca "Entrada (lote)".</div>';
  } else {
    h+='<div class="card">';
    ls.forEach(function(l){
      var st=lotStatus(l);
      var d=daysUntil(l.expirationDate);
      var dtxt= !l.expirationDate? 'Sin caducidad' : (d<0? 'Caducado hace '+Math.abs(d)+' d' : d===0? 'Caduca hoy' : 'Faltan '+d+' días');
      h+='<div class="lotrow">';
      h+='<span class="pill '+st+'">'+statusLabel(st)+'</span>';
      h+='<div><div class="date">'+fmtDate(l.expirationDate)+'</div><div class="days">'+dtxt+(l.location?' · '+escapeHtml(l.location):'')+'</div></div>';
      h+='<div class="qty">'+fmtQty(l.quantity)+' '+escapeHtml(p.unit||'pza')+(l.quantity<=0?'<div class="loc">agotado</div>':'')+'</div>';
      h+='<button class="delbtn" data-lid="'+l.id+'" title="Eliminar lote">'+svgIcon(I.trash,18)+'</button>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(movs.length){
    h+='<div class="section-title"><h2>Últimos movimientos</h2></div>';
    h+='<div class="card">';
    movs.forEach(function(m){
      var d=new Date(m.ts);
      var ds=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
      var mtype = m.type==='in'?'Entrada': m.type==='adjust'?'Ajuste':'Salida';
      var mcolor = m.type==='in'?'var(--ok)': m.type==='adjust'?'var(--warn)':'var(--danger)';
      var msign = num(m.qty)<0?'-':'+';
      h+='<div class="movrow"><div><div class="t" style="color:'+mcolor+'">'+mtype+'</div><div class="d">'+ds+(m.expiration?' · vence '+fmtDate(m.expiration):'')+(m.note?' · '+escapeHtml(m.note):'')+'</div></div><div class="q" style="color:'+mcolor+'">'+msign+fmtQty(Math.abs(num(m.qty)))+'</div></div>';
    });
    h+='</div>';
  }
  main.innerHTML=h;
  var dp=document.getElementById('detailPhoto');
  dp.onclick=function(){ if(p.photo) openViewer(p.photo,p.name); else openProductForm(p); };
  document.getElementById('addLotBtn').onclick=function(){ openLotForm(p.id); };
  document.getElementById('outBtn').onclick=function(){ openOutForm(p.id); };
  document.getElementById('editBtn').onclick=function(){ openProductForm(p); };
  document.getElementById('delBtn').onclick=function(){
    confirmDlg('Eliminar producto','Se eliminará "'+p.name+'" con todos sus lotes y movimientos.','Eliminar',function(){ deleteProduct(p.id); });
  };
  main.querySelectorAll('.delbtn').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); var lid=b.getAttribute('data-lid');
      confirmDlg('Eliminar lote','¿Quitar este lote del inventario?','Eliminar',async function(){ await delOne('lots',lid); await refresh(); scheduleAutoUpload(); toast('Lote eliminado'); renderDetail(); });
    };
  });
}

function showView(name){
  currentView=name;
  document.getElementById('backBtn').style.display='none';
  document.getElementById('topTitle').textContent= name==='products'?'Productos': name==='cyclics'?'Cíclicos': name==='more'?'Ajustes':'Stock Lotes';
  document.getElementById('topSub').textContent= name==='products'? (products.length+' productos registrados') : name==='cyclics'?'Verificación manual de inventario': name==='more'?'Respaldos y configuración':'Control de inventario por caducidad';
  document.querySelectorAll('nav.bottom .tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-view')===name); });
  if(name==='home') renderHome();
  else if(name==='products') renderProducts();
  else if(name==='alerts') renderAlerts();
  else if(name==='cyclics') renderCyclics();
  else if(name==='cyclicSession') renderCyclicSession();
  else if(name==='cyclicReport') renderCyclicReport(currentCyclicId);
  else if(name==='more') renderMore();
  window.scrollTo(0,0);
}

/* ================= ADD FLOW ================= */
var addStageEl=document.getElementById('addStage');
var scannerInstance=null, scannerRunning=false;
function stopScannerIfAny(){
  if(scannerInstance && scannerRunning){
    try{ scannerInstance.stop().then(function(){scannerInstance.clear();scannerRunning=false;}).catch(function(){}); }catch(e){}
  }
}
function openAddFlow(prefillCode){
  pendingPhoto=null;
  addStageEl.innerHTML='';
  openOverlay('addOverlay');
  renderStageBarcode(prefillCode||'');
}
function renderStageBarcode(code){
  var h='<h3>1. Código de barras</h3><p class="hint">Escribe el código o escánelo con la cámara. Si el producto ya existe, agregarás directamente una entrada (lote).</p>';
  h+='<label class="field"><span>Código de barras</span><input id="bcInput" inputmode="numeric" placeholder="Ej. 7501000123456" value="'+escapeHtml(code||'')+'"></label>';
  h+='<div class="btn-row"><button class="btn ghost" id="scanBtn">'+svgIcon(I.scan,18)+'Cámara en vivo</button><button class="btn ghost" id="scanPhotoBtn">'+svgIcon(I.camera,18)+'Foto del código</button></div>';
  h+='<div id="scanArea" style="display:none;margin-top:12px"><div id="reader"></div><p class="muted" style="text-align:center;margin-top:8px">Apunta al código de barras del producto. Si no funciona, usa "Foto del código".</p></div>';
  h+='<div class="btn-row" style="margin-top:16px"><button class="btn ghost" id="skipBtn">Sin código</button><button class="btn primary" id="bcContinue">Continuar</button></div>';
  addStageEl.innerHTML=h;
  var inp=document.getElementById('bcInput'); inp.focus();
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); continueFromBarcode(); } });
  document.getElementById('bcContinue').onclick=continueFromBarcode;
  document.getElementById('skipBtn').onclick=function(){ openProductForm(null,'',null); };
  document.getElementById('scanBtn').onclick=startScanner;
  document.getElementById('scanPhotoBtn').onclick=function(){
    scanFromPhoto(function(decoded){
      var inp=document.getElementById('bcInput'); if(inp){ inp.value=decoded; }
      toast('Código detectado');
      continueFromBarcode();
    });
  };
}
function startScanner(){
  var area=document.getElementById('scanArea'); area.style.display='block';
  var loadThen=function(){
    try{
      scannerInstance=new Html5Qrcode('reader');
      scannerInstance.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},function(decoded){
        if(scannerRunning){
          scannerRunning=false;
          try{ scannerInstance.stop().then(function(){scannerInstance.clear(); area.style.display='none'; document.getElementById('bcInput').value=decoded; toast('Código detectado'); continueFromBarcode(); }).catch(function(){}); }catch(e){}
        }
      },function(){}).then(function(){scannerRunning=true;}).catch(function(err){ area.style.display='none'; toast(cameraErrorReason()); });
    }catch(e){ area.style.display='none'; toast('Escribe el código manualmente.'); }
  };
  if(window.Html5Qrcode){ loadThen(); return; }
  toast('Cargando lector...');
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
  s.onload=loadThen;
  s.onerror=function(){ area.style.display='none'; toast('Sin conexión. Escribe el código.'); };
  document.head.appendChild(s);
}
async function continueFromBarcode(){
  var code=document.getElementById('bcInput').value.trim();
  var existing= code? products.find(function(p){return p.barcode===code;}) : null;
  if(existing){ toast('Producto existente: '+existing.name); openLotForm(existing.id); return; }
  // lookup
  var info=null;
  if(code){
    var btn=document.getElementById('bcContinue'); if(btn){btn.textContent='Buscando...';btn.disabled=true;}
    info=await lookupBarcode(code);
  }
  openProductForm(null, code, info);
}

  var notes= existing? (existing.notes||'') : '';
  var h='<h3>'+(isEdit?'Editar producto':'2. Nuevo producto')+'</h3>';
  h+='<p class="hint">'+(info&&info.name? 'Nombre sugerido automáticamente. Puedes editarlo.':'Captura los datos y la foto del producto.')+'</p>';
  h+='<div class="photobox" id="photoBox">'+(pendingPhoto? '<img src="'+pendingPhoto+'"><span class="over">Cambiar foto</span>': svgIcon(I.camera,28)+'<span>Tomar foto / elegir imagen</span>')+'</div>';
  h+='<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">';
  h+='<label class="field"><span>Nombre del producto *</span><input id="pName" value="'+escapeHtml(name)+'" placeholder="Ej. Coca-Cola 600 ml"></label>';
  h+='<label class="field"><span>Código de barras</span><input id="pBarcode" inputmode="numeric" value="'+escapeHtml(barcode)+'" placeholder="Opcional"></label>';
  h+='<div style="display:flex;gap:10px">';
  h+='<label class="field" style="flex:1"><span>Categoría</span><select id="pCat">'+CATEGORIES.map(function(c){return '<option '+(c===category?'selected':'')+'>'+c+'</option>';}).join('')+'</select></label>';
  h+='<label class="field" style="flex:1"><span>Unidad</span><select id="pUnit">'+UNITS.map(function(u){return '<option '+(u===unit?'selected':'')+'>'+u+'</option>';}).join('')+'</select></label>';
  h+='</div>';
  h+='<label class="field"><span>Notas (opcional)</span><textarea id="pNotes" placeholder="Ubicación en tienda, proveedor...">'+escapeHtml(notes)+'</textarea></label>';
  h+='<div class="btn-row"><button class="btn ghost" id="pCancel">Cancelar</button><button class="btn primary" id="pSave">'+(isEdit?'Guardar cambios':'Guardar y agregar lote')+'</button></div>';
  addStageEl.innerHTML=h;

    var data=await resizeImage(f,1600,0.85);

      barcode: bc,

/* ================= LOT FORM (entrada) ================= */
function openLotForm(productId){
  var p=productById(productId);
  if(!p) return;
  var h='<h3>Entrada de mercancía</h3>';
  h+='<p class="hint">Producto: <strong>'+escapeHtml(p.name)+'</strong>'+(p.barcode?' · #'+escapeHtml(p.barcode):'')+'. Cada entrada con distinta caducidad es un lote independiente.</p>';
  h+='<label class="field"><span>Fecha de caducidad *</span><input type="date" id="lExp"></label>';
  h+='<label class="field"><span>Cantidad *</span><input type="number" id="lQty" inputmode="decimal" min="0" step="0.01" placeholder="Ej. 24"></label>';
  h+='<label class="field"><span>Ubicación / anaquel (opcional)</span><input id="lLoc" placeholder="Ej. Pasillo 3, anaquel alto"></label>';
  h+='<div class="btn-row"><button class="btn ghost" id="lCancel">Cancelar</button><button class="btn primary2" id="lSave">'+svgIcon(I.plus,18)+'Registrar entrada</button></div>';
  addStageEl.innerHTML=h;
  document.getElementById('lCancel').onclick=function(){ closeOverlay('addOverlay'); };
  document.getElementById('lSave').onclick=async function(){
    var exp=document.getElementById('lExp').value;
    var qty=num(document.getElementById('lQty').value);
    if(!exp){ toast('Elige la fecha de caducidad'); return; }
    if(qty<=0){ toast('Cantidad inválida'); return; }
    var loc=document.getElementById('lLoc').value.trim();
    var lot={id:uid(), productId:productId, expirationDate:exp, quantity:qty, location:loc, createdAt:Date.now()};
    await putOne('lots',lot);
    await putOne('movements',{id:uid(), productId:productId, lotId:lot.id, type:'in', qty:qty, expiration:exp, ts:Date.now()});
    await refresh();
    scheduleAutoUpload();
    closeOverlay('addOverlay');
    toast('Entrada registrada: +'+fmtQty(qty)+' '+p.unit);
    if(currentView==='detail' && currentProductId===productId) renderDetail();
    else if(currentView==='home') renderHome(); else showView(currentView);
  };
}

/* ================= OUT FORM (salida FEFO) ================= */
function openOutForm(productId){
  var p=productById(productId);
  if(!p) return;
  var avail=totalQty(productId);
  if(avail<=0){ toast('No hay existencia de este producto'); return; }
  var ls=activeLots(productId);
  var h='<h3>Salida de mercancía</h3>';
  h+='<p class="hint">Producto: <strong>'+escapeHtml(p.name)+'</strong>. Existencia total: <strong>'+fmtQty(avail)+' '+escapeHtml(p.unit||'pza')+'</strong>. Se descontará primero del lote que caduque antes.</p>';
  h+='<div class="card" style="margin-bottom:14px">';
  ls.forEach(function(l){
    h+='<div class="lotrow" style="padding:10px 14px"><span class="pill '+lotStatus(l)+'">'+fmtDate(l.expirationDate)+'</span><div class="qty" style="font-size:14px">'+fmtQty(l.quantity)+'</div></div>';
  });
  h+='</div>';
  h+='<label class="field"><span>Cantidad a salir *</span><input type="number" id="oQty" inputmode="decimal" min="0" step="0.01" placeholder="Máximo '+fmtQty(avail)+'"></label>';
  h+='<div class="btn-row"><button class="btn ghost" id="oCancel">Cancelar</button><button class="btn primary" id="oSave">'+svgIcon(I.minus,18)+'Registrar salida</button></div>';
  addStageEl.innerHTML=h;
  openOverlay('addOverlay');
  document.getElementById('oCancel').onclick=function(){ closeOverlay('addOverlay'); };
  document.getElementById('oSave').onclick=async function(){
    var q=num(document.getElementById('oQty').value);
    if(q<=0){ toast('Cantidad inválida'); return; }
    if(q>avail+0.0001){ toast('Solo hay '+fmtQty(avail)+' disponibles'); return; }
    var remaining=q;
    var breakdown=[];
    for(var i=0;i<ls.length && remaining>0.0001;i++){
      var take=Math.min(ls[i].quantity, remaining);
      ls[i].quantity=Math.round((ls[i].quantity-take)*1000)/1000;
      await putOne('lots',ls[i]);
      await putOne('movements',{id:uid(), productId:productId, lotId:ls[i].id, type:'out', qty:take, expiration:ls[i].expirationDate, ts:Date.now()});
      breakdown.push(fmtDate(ls[i].expirationDate)+': -'+fmtQty(take));
      remaining=Math.round((remaining-take)*1000)/1000;
    }
    await refresh();
    scheduleAutoUpload();
    closeOverlay('addOverlay');
    toast('Salida registrada: -'+fmtQty(q)+' '+p.unit);
    if(currentView==='detail' && currentProductId===productId) renderDetail();
    else if(currentView==='home') renderHome(); else showView(currentView);
  };
}

async function deleteProduct(pid){
  await delOne('products',pid);
  var ls=await getAll('lots');
  for(var i=0;i<ls.length;i++) if(ls[i].productId===pid) await delOne('lots',ls[i].id);
  var ms=await getAll('movements');
  for(var j=0;j<ms.length;j++) if(ms[j].productId===pid) await delOne('movements',ms[j].id);
  await refresh();
  scheduleAutoUpload();
  toast('Producto eliminado');
  showView('products');
}

/* ================= CLOUD SYNC (Google Drive via Apps Script) ================= */
var syncUrl=localStorage.getItem('syncUrl')||'';
var autoSync=localStorage.getItem('autoSync')==='1';
var lastSync=localStorage.getItem('lastSync')||'';
var syncTimer=null;
var APPS_SCRIPT_CODE = `// Puente de sincronizacion para Stock Lotes (Google Drive)
// 1. Abre script.google.com -> Nuevo proyecto
// 2. Pega TODO este codigo
// 3. Implementar -> Nueva implementacion -> Tipo: Aplicacion web
//    Ejecutar como: Yo (tu cuenta de Google)
//    Quien tiene acceso: Cualquiera (Anyone)
// 4. Copia la URL (termina en /exec) y pegala en la app
var FILE_NAME = 'stocklotes-respaldo.json';

function doGet(e) {
  var f = buscarArchivo();
  if (!f) return salida({ ok: true, data: null, mensaje: 'Sin respaldo' });
  var datos = null;
  try { datos = JSON.parse(f.getBlob().getDataAsString()); } catch (err) {}
  return salida({ ok: true, data: datos, actualizado: f.getLastUpdated().toISOString() });
}

function doPost(e) {
  try {
    var texto = (e && e.postData && e.postData.contents) || '{}';
    var f = buscarArchivo();
    if (f) { f.setContent(texto); }
    else { DriveApp.createFile(FILE_NAME, texto, 'application/json'); }
    return salida({ ok: true, actualizado: new Date().toISOString() });
  } catch (err) {
    return salida({ ok: false, error: String(err) });
  }
}

function buscarArchivo() {
  var archivos = DriveApp.getFilesByName(FILE_NAME);
  return archivos.hasNext() ? archivos.next() : null;
}

function salida(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;
function scheduleAutoUpload(){
  if(!syncUrl || !autoSync) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ cloudUpload().then(function(){ if(currentView==='more'){ var s=document.getElementById('syncStatus'); if(s){ s.textContent='Respaldado: '+fmtDateTime(lastSync); s.className='sync-status ok'; } } }).catch(function(){ /* silent */ }); }, 1500);
}
function cloudPayload(){
  return {app:'StockLotes', version:1, savedAt:new Date().toISOString(), alertDays:alertDays, products:products, lots:lots, movements:movements};
}
function cloudUpload(){
  if(!syncUrl) return Promise.reject(new Error('Configura primero la URL de sincronización'));
  return fetch(syncUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(cloudPayload())})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j || !j.ok) throw new Error((j&&j.error)||'respuesta inválida');
      lastSync=new Date().toISOString(); localStorage.setItem('lastSync',lastSync);
      return j;
    });
}
function cloudDownload(){
  if(!syncUrl) return Promise.reject(new Error('Configura primero la URL de sincronización'));
  return fetch(syncUrl).then(function(r){return r.json();}).then(function(j){
    if(!j || !j.ok) throw new Error((j&&j.error)||'respuesta inválida');
    return j.data||null;
  });
}

  var data={app:'StockLotes', version:1, exportedAt:new Date().toISOString(), alertDays:alertDays, products:products, lots:lots, movements:movements};

async function importData(file){
  try{
    var text=await file.text();
    var data=JSON.parse(text);
    if(!data.products || !data.lots) throw new Error('formato');
    confirmDlg('Importar respaldo','Se reemplazarán todos los datos actuales con el contenido del respaldo.','Importar',async function(){
      await wipeAllSilent();
      for(var i=0;i<data.products.length;i++) await putOne('products',data.products[i]);
      for(var j=0;j<data.lots.length;j++) await putOne('lots',data.lots[j]);
      if(data.movements) for(var k=0;k<data.movements.length;k++) await putOne('movements',data.movements[k]);
      if(data.alertDays){ alertDays=data.alertDays; localStorage.setItem('alertDays',String(alertDays)); }
      await refresh();
      toast('Datos importados correctamente');
      showView('home');
    });
  }catch(e){ toast('Archivo inválido'); }

async function wipeAllSilent(){

  var ls=await getAll('lots'); for(var j=0;j<ls.length;j++) await delOne('lots',ls[j].id);

/* ================= PHOTO VIEWER (pinch zoom) ================= */
var viewer=document.getElementById('viewer'), viewerImg=document.getElementById('viewerImg');
var vScale=1, vTx=0, vTy=0, vPointers={}, vLastDist=0, vLastMid=null, vLastTap=0;
function applyViewerTransform(){ viewerImg.style.transform='translate('+vTx+'px,'+vTy+'px) scale('+vScale+')'; }
function resetViewer(){ vScale=1; vTx=0; vTy=0; applyViewerTransform(); }
function openViewer(dataURL, caption){
  document.getElementById('viewerCap').textContent=caption? escapeHtml(caption)+' · doble toque = zoom' : 'Doble toque para acercar · pellizca para zoom';
  viewerImg.src=dataURL;
  viewer.classList.add('show');
  resetViewer();
}
function closeViewer(){ viewer.classList.remove('show'); setTimeout(resetViewer,200); }
document.getElementById('viewerClose').onclick=closeViewer;
viewer.addEventListener('click',function(e){ if(e.target===viewer) closeViewer(); });
function midpoint(p1,p2){ return {x:(p1.clientX+p2.clientX)/2, y:(p1.clientY+p2.clientY)/2}; }
function dist(p1,p2){ return Math.hypot(p1.clientX-p2.clientX, p1.clientY-p2.clientY); }
viewerImg.addEventListener('pointerdown',function(e){
  var now=Date.now();
  if(now-vLastTap<300 && Object.keys(vPointers).length===0){ // double tap
    if(vScale>1){ resetViewer(); } else { vScale=2.5; applyViewerTransform(); }
    vLastTap=0; return;
  }
  vLastTap=now;
  vPointers[e.pointerId]={x:e.clientX,y:e.clientY};
  viewerImg.setPointerCapture(e.pointerId);
  var ids=Object.keys(vPointers);
  if(ids.length===2){ var ps=Object.values(vPointers); vLastDist=dist(ps[0],ps[1]); vLastMid=midpoint(ps[0],ps[1]); }
});
viewerImg.addEventListener('pointermove',function(e){
  if(!vPointers[e.pointerId]) return;
  vPointers[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(vPointers);
  if(ids.length===2){
    var ps=Object.values(vPointers);
    var d=dist(ps[0],ps[1]);
    var m=midpoint(ps[0],ps[1]);
    if(vLastDist>0){
      var ratio=d/vLastDist;
      vScale=Math.min(4,Math.max(1,vScale*ratio));
      if(vLastMid){ vTx+=m.x-vLastMid.x; vTy+=m.y-vLastMid.y; }
      applyViewerTransform();
    }
    vLastDist=d; vLastMid=m;
  } else if(ids.length===1 && vScale>1){
    var p=vPointers[ids[0]];
    vTx+=e.clientX-p.x; vTy+=e.clientY-p.y;
    applyViewerTransform();
    vPointers[ids[0]]={x:e.clientX,y:e.clientY};
  }
});
function endPointer(e){
  delete vPointers[e.pointerId];
  var ids=Object.keys(vPointers);
  if(ids.length<2){ vLastDist=0; vLastMid=null; }
  if(vScale<=1.01){ vTx=0; vTy=0; applyViewerTransform(); }
}
viewerImg.addEventListener('pointerup',endPointer);
viewerImg.addEventListener('pointercancel',endPointer);
viewerImg.addEventListener('wheel',function(e){
  e.preventDefault();
  var delta=e.deltaY<0?1.1:0.9;
  vScale=Math.min(4,Math.max(1,vScale*delta));
  if(vScale<=1.01){vTx=0;vTy=0;}
  applyViewerTransform();
},{passive:false});

/* ================= CÍCLICOS (verificación manual de inventario) ================= */
var cyclics=[], currentCyclicId=null, cyclicNewLots=[], cyclicScanner=null, cyclicScanRunning=false, cyclicTicketPhoto=null;
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function getCyclic(id){ for(var i=0;i<cyclics.length;i++) if(cyclics[i].id===id) return cyclics[i]; return null; }
function cyclicItemByProduct(cyc,pid){ if(!cyc||!cyc.items) return null; for(var i=0;i<cyc.items.length;i++) if(cyc.items[i].productId===pid) return cyc.items[i]; return null; }
function cyclicChecked(cyc){ return (cyc.items||[]).filter(function(it){return it.checked;}).length; }
function cyclicItemStatus(cyc,p){
  var it=cyclicItemByProduct(cyc,p.id);
  if(!it||!it.checked) return {key:'pend', label:'Pendiente', cls:'soon'};
  if(Math.abs(it.discrepancy||0)<0.01) return {key:'ok', label:'Contado', cls:'ok'};
  var d=it.discrepancy; return {key:'diff', label:(d>0?'+':'')+fmtQty(d), cls:'expired'};
}

function renderCyclics(){
  var open=cyclics.filter(function(c){return c.status==='open';});
  var closed=cyclics.filter(function(c){return c.status!=='open';}).sort(function(a,b){return b.createdAt-a.createdAt;});
  var h='';
  if(open.length){
    var c0=open[0]; var pr=cyclicChecked(c0);
    h+='<div class="card" style="padding:14px;margin-top:14px;border-color:var(--accent);background:var(--accent-soft)">';
    h+='<div style="font-weight:700;font-size:16px">Cíclico en progreso</div>';
    h+='<div class="muted" style="margin:2px 0 8px">'+escapeHtml(c0.employee||'')+' · '+fmtDate(c0.date)+' · '+pr+'/'+products.length+' revisados</div>';
    h+='<div class="progbar"><div style="width:'+(products.length? Math.round(pr/products.length*100):0)+'%"></div></div>';
    h+='<div class="btn-row"><button class="btn primary" id="resumeCyclic">Continuar</button><button class="btn ghost" id="discardCyclic">Descartar</button></div>';
    h+='</div>';
  } else {
    h+='<div class="btn-row" style="margin-top:14px"><button class="btn primary" id="newCyclicBtn">'+svgIcon(I.scan,18)+'Nuevo cíclico</button></div>';
    h+='<p class="muted" style="text-align:center;margin-top:10px">Registra la verificación manual: escanea productos, confirma cantidades físicas y caducidades.</p>';
  }
  if(closed.length){
    h+='<div class="section-title"><h2>Cíclicos anteriores</h2></div><div class="list">';
    closed.forEach(function(c){
      var pr=cyclicChecked(c);
      var diffs=(c.items||[]).filter(function(it){return Math.abs(it.discrepancy||0)>0.01;}).length;
      h+='<div class="card pcard" data-cid="'+c.id+'" style="cursor:pointer">';
      h+='<div class="thumb" style="background:var(--accent2-soft);color:var(--accent2)">'+svgIcon(I.check,26)+'</div>';
      h+='<div class="info"><div class="name">'+fmtDate(c.date)+'</div><div class="meta">'+escapeHtml(c.employee||'')+' · '+pr+'/'+products.length+' revisados</div></div>';
      h+='<div><div class="qty" style="color:'+(diffs?'var(--danger)':'var(--ok)')+'">'+(diffs? diffs+' dif.':'OK')+'</div></div>';
      h+='</div>';
    });
    h+='</div>';
  }
  main.innerHTML=h;
  var nb=document.getElementById('newCyclicBtn'); if(nb) nb.onclick=openNewCyclicForm;
  var rs=document.getElementById('resumeCyclic'); if(rs) rs.onclick=function(){ startCyclic(open[0].id); };
  var dc=document.getElementById('discardCyclic'); if(dc) dc.onclick=function(){ confirmDlg('Descartar cíclico','Se eliminará el cíclico en progreso sin guardar el reporte.','Descartar',async function(){ await delOne('cyclics',open[0].id); await refresh(); renderCyclics(); toast('Cíclico descartado'); }); };
  main.querySelectorAll('[data-cid]').forEach(function(el){ el.onclick=function(){ renderCyclicReport(el.getAttribute('data-cid')); }; });
}

function startCyclic(id){
  currentCyclicId=id; currentView='cyclicSession';
  document.getElementById('backBtn').style.display='flex';
  document.querySelectorAll('nav.bottom .tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('topTitle').textContent='Cíclico en curso';
  var c=getCyclic(id);
  document.getElementById('topSub').textContent=(c? c.employee+' · '+fmtDate(c.date):'');
  renderCyclicSession();
  window.scrollTo(0,0);
}

function renderCyclicSession(){
  var cyc=getCyclic(currentCyclicId); if(!cyc){ showView('cyclics'); return; }
  var checked=cyclicChecked(cyc), total=products.length;
  var pct=total? Math.round(checked/total*100):0;

    });

  }

    h+='<div class="cathead">'+escapeHtml(cat)+' ('+cats[cat].length+')</div><div class="list">';
    cats[cat].sort(function(a,b){return (a.name||'').localeCompare(b.name||'','es');}).forEach(function(p){
      var st=cyclicItemStatus(cyc,p);
      h+='<div class="card pcard" data-vpid="'+p.id+'">';

      h+='<div class="info"><div class="name">'+escapeHtml(p.name)+'</div><div class="meta">'+(p.barcode? '#'+escapeHtml(p.barcode):'Sin código')+' · stock app: '+fmtQty(totalQty(p.id))+'</div></div>';
      h+='<span class="pill '+st.cls+'">'+st.label+'</span>';
      h+='</div>';
    });
    h+='</div>';
  });
  if(!products.length) h+='<div class="empty"><div class="big">'+svgIcon(I.box,44)+'</div><p>Registra productos primero.</p></div>';
  main.innerHTML=h;

  main.querySelectorAll('[data-vpid]').forEach(function(el){ el.onclick=function(){ verifyProduct(el.getAttribute('data-vpid')); }; });
}

function openCyclicScanner(){
  openOverlay('scanOverlay');
  var loadThen=function(){
    try{
      cyclicScanner=new Html5Qrcode('cyclicReader');
      cyclicScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},function(decoded){
        if(cyclicScanRunning) return;
        cyclicScanRunning=true;
        try{ cyclicScanner.stop().then(function(){cyclicScanner.clear(); cyclicScanRunning=false; closeOverlay('scanOverlay'); var p=products.find(function(pp){return pp.barcode===decoded;}); if(p){ verifyProduct(p.id);} else { toast('Producto no registrado: '+decoded); openAddFlow(decoded);} }).catch(function(){cyclicScanRunning=false;}); }catch(e){ cyclicScanRunning=false; }
      },function(){}).then(function(){}).catch(function(){ closeOverlay('scanOverlay'); toast(cameraErrorReason()); });
    }catch(e){ closeOverlay('scanOverlay'); toast('Escribe el código manualmente'); }
  };
  if(window.Html5Qrcode){ loadThen(); return; }
  toast('Cargando lector...');
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
  s.onload=loadThen; s.onerror=function(){ closeOverlay('scanOverlay'); toast('Sin conexión. Busca el producto en la lista'); };
  document.head.appendChild(s);
}
document.getElementById('scanCloseBtn').onclick=function(){
  if(cyclicScanner){ try{ cyclicScanner.stop().then(function(){try{cyclicScanner.clear();}catch(e){}}).catch(function(){}); }catch(e){} }
  cyclicScanRunning=false;
  closeOverlay('scanOverlay');
};
document.getElementById('scanPhotoCyclic').onclick=function(){
  if(cyclicScanner){ try{ cyclicScanner.stop().then(function(){try{cyclicScanner.clear();}catch(e){}}).catch(function(){}); }catch(e){} }
  cyclicScanRunning=false;
  closeOverlay('scanOverlay');
  scanFromPhoto(function(decoded){
    var p=products.find(function(pp){return pp.barcode===decoded;});
    if(p){ verifyProduct(p.id); } else { toast('Producto no registrado: '+decoded); openAddFlow(decoded); }
  });
};
function cameraErrorReason(){
  if(!window.isSecureContext || !navigator.mediaDevices) return 'Cámara en vivo bloqueada aquí. Usa "Foto del código" o abre la app por https / agrégala a inicio.';
  return 'Permiso de cámara denegado. Usa "Foto del código" o escríbelo.';
}
var qrLibLoading=null;
function ensureQrLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  if(qrLibLoading) return qrLibLoading;
  qrLibLoading=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=function(){res();}; s.onerror=function(){rej(new Error('Sin conexión'));};
    document.head.appendChild(s);
  });
  return qrLibLoading;
}
function scanFromPhoto(onDecoded){
  var inp=document.getElementById('barcodePhotoInput');
  inp.value='';
  inp.onchange=function(e){
    var f=e.target.files[0]; if(!f) return;
    toast('Analizando foto...');
    ensureQrLib().then(function(){
      var qr=new Html5Qrcode('photoScanReader');
      return qr.scanFile(f,false);
    }).then(function(decoded){
      onDecoded(decoded);
    }).catch(function(err){
      toast('No se detectó un código. Toma la foto más cerca o escríbelo.');
    });
  };
  inp.click();
}

function verifyProduct(pid){
  var p=productById(pid); if(!p) return;
  var cyc=getCyclic(currentCyclicId);
  var existing=cyclicItemByProduct(cyc,pid);
  var ls=productLots(pid).filter(function(l){return l.quantity>0;});
  cyclicNewLots=(existing&&existing.newLots)? existing.newLots.map(function(x){return {expiration:x.expiration,quantity:x.quantity,location:x.location||''};}) : [];
  var s=document.getElementById('modalSheet');
  var h='<div class="handle"></div><h3>Verificar: '+escapeHtml(p.name)+'</h3>';
  h+='<p class="hint">'+(p.barcode? '#'+escapeHtml(p.barcode)+' · ':'')+escapeHtml(p.category||'')+' · unidad: '+escapeHtml(p.unit||'pza')+'. Escribe la cantidad física por lote y confirma la caducidad.</p>';
  if(!ls.length) h+='<p class="muted" style="margin:0 0 10px;color:var(--warn)"><strong>Sin lotes registrados</strong> en la app. Agrega abajo lo encontrado físicamente.</p>';
  h+='<div id="lotCountRows">';
  ls.forEach(function(l){
    var st=lotStatus(l); var counted = existing&&existing.lotCounts&&existing.lotCounts[l.id]!=null ? existing.lotCounts[l.id] : l.quantity;
    h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span class="pill '+st+'">'+fmtDate(l.expirationDate)+'</span>';
    h+='<div style="flex:1"><div class="muted" style="font-size:11px">Registrado: '+fmtQty(l.quantity)+'</div><input type="number" inputmode="decimal" step="0.01" id="lc_'+l.id+'" value="'+counted+'" style="width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px;font-family:inherit;font-size:14px"></div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div id="newLotRows"></div>';
  h+='<button class="btn ghost small" id="addNewLotBtn" style="margin-bottom:14px">'+svgIcon(I.plus,16)+'Agregar lote encontrado</button>';
  h+='<label class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><input type="checkbox" id="adjustToggle" checked style="width:20px;height:20px"><span style="font-size:13.5px;font-weight:600;color:var(--text)">Ajustar inventario de la app a lo contado</span></label>';
  h+='<div class="btn-row"><button class="btn ghost" id="verifyCancel">Cerrar</button><button class="btn primary2" id="verifySave">Confirmar contado</button></div>';
  s.innerHTML=h;
  openOverlay('modalOverlay');
  renderNewLotRows();
  document.getElementById('addNewLotBtn').onclick=function(){ cyclicNewLots.push({expiration:'',quantity:'',location:''}); renderNewLotRows(); };
  document.getElementById('verifyCancel').onclick=function(){ closeOverlay('modalOverlay'); };
  document.getElementById('verifySave').onclick=function(){ saveCyclicItem(pid); };
}
function renderNewLotRows(){
  var c=document.getElementById('newLotRows'); if(!c) return;
  var h='';
  cyclicNewLots.forEach(function(nl,i){
    h+='<div style="border:1.5px dashed var(--accent);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-end">';
    h+='<div style="flex:1"><div class="muted" style="font-size:11px;margin-bottom:3px">Caducidad</div><input type="date" class="nl_exp" data-i="'+i+'" value="'+escapeHtml(nl.expiration)+'" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px;font-family:inherit;font-size:13px"></div>';
    h+='<div style="width:90px"><div class="muted" style="font-size:11px;margin-bottom:3px">Cantidad</div><input type="number" inputmode="decimal" step="0.01" class="nl_qty" data-i="'+i+'" value="'+escapeHtml(nl.quantity)+'" style="width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px;font-family:inherit;font-size:13px"></div>';
    h+='<button class="delbtn nl_del" data-i="'+i+'">'+svgIcon(I.trash,16)+'</button>';
    h+='</div>';
  });
  c.innerHTML=h;
  c.querySelectorAll('.nl_exp').forEach(function(inp){ inp.onchange=function(){ cyclicNewLots[+inp.getAttribute('data-i')].expiration=inp.value; }; });
  c.querySelectorAll('.nl_qty').forEach(function(inp){ inp.oninput=function(){ cyclicNewLots[+inp.getAttribute('data-i')].quantity=inp.value; }; });
  c.querySelectorAll('.nl_del').forEach(function(b){ b.onclick=function(){ cyclicNewLots.splice(+b.getAttribute('data-i'),1); renderNewLotRows(); }; });
}

async function saveCyclicItem(pid){
  var p=productById(pid); var cyc=getCyclic(currentCyclicId);
  var ls=productLots(pid).filter(function(l){return l.quantity>0;});
  var lotCounts={}, recordedTotal=0, countedTotal=0;
  for(var i=0;i<ls.length;i++){
    var l=ls[i]; recordedTotal+=num(l.quantity);
    var inp=document.getElementById('lc_'+l.id);
    var c= inp? num(inp.value) : num(l.quantity);
    if(c<0) c=0;
    lotCounts[l.id]=c; countedTotal+=c;
  }
  var newLots=[];
  cyclicNewLots.forEach(function(nl){
    var q=num(nl.quantity); if(q>0 && nl.expiration){ newLots.push({expiration:nl.expiration, quantity:q, location:nl.location||''}); countedTotal+=q; }
  });
  var discrepancy=Math.round((countedTotal-recordedTotal)*100)/100;
  var adjust=document.getElementById('adjustToggle').checked;
  var item={productId:pid, barcode:p.barcode||'', name:p.name, category:p.category||'', lotsSnap:ls.map(function(l){return {lotId:l.id, expiration:l.expirationDate, recordedQty:num(l.quantity)};}), lotCounts:lotCounts, newLots:newLots, countedTotal:countedTotal, recordedTotal:recordedTotal, discrepancy:discrepancy, adjust:adjust, checked:true, checkedAt:Date.now()};
  if(adjust){
    try{ await applyCyclicAdjustment(item); }catch(e){ toast('Error al ajustar: '+e.message); }
  }
  var idx=-1; for(var j=0;j<(cyc.items||[]).length;j++) if(cyc.items[j].productId===pid){idx=j;break;}
  if(!cyc.items) cyc.items=[];
  if(idx>=0) cyc.items[idx]=item; else cyc.items.push(item);
  await putOne('cyclics',cyc); await refresh(); scheduleAutoUpload();
  closeOverlay('modalOverlay');
  toast('Contado guardado: '+fmtQty(countedTotal)+' '+(p.unit||'pza')+(discrepancy? ' (dif '+(discrepancy>0?'+':'')+fmtQty(discrepancy)+')':''));
  renderCyclicSession();
}

async function applyCyclicAdjustment(item){
  var pid=item.productId;
  for(var i=0;i<(item.lotsSnap||[]).length;i++){
    var ls=item.lotsSnap[i];
    var counted = item.lotCounts && item.lotCounts[ls.lotId]!=null ? num(item.lotCounts[ls.lotId]) : ls.recordedQty;
    var lot=await getOne('lots', ls.lotId);
    if(lot){
      var diff=Math.round((counted-lot.quantity)*1000)/1000;
      lot.quantity=counted;
      await putOne('lots',lot);
      if(Math.abs(diff)>0.001){
        await putOne('movements',{id:uid(), productId:pid, lotId:lot.id, type:'adjust', qty:diff, expiration:lot.expirationDate, note:'Ajuste por cíclico', ts:Date.now()});
      }
    }
  }
  for(var j=0;j<(item.newLots||[]).length;j++){
    var nl=item.newLots[j];
    var nlot={id:uid(), productId:pid, expirationDate:nl.expiration, quantity:num(nl.quantity), location:nl.location||'', createdAt:Date.now()};
    await putOne('lots',nlot);
    await putOne('movements',{id:uid(), productId:pid, lotId:nlot.id, type:'in', qty:num(nl.quantity), expiration:nl.expiration, note:'Lote encontrado en cíclico', ts:Date.now()});
  }
}

function finalizeCyclic(){
  var cyc=getCyclic(currentCyclicId); if(!cyc) return;
  var checked=cyclicChecked(cyc), pend=products.length-checked;
  confirmDlg('Finalizar cíclico','Productos revisados: '+checked+'/'+products.length+(pend? '\nPendientes de escanear: '+pend:'')+'\nSe generará el reporte.','Finalizar',async function(){
    cyc.status='closed'; cyc.closedAt=Date.now();
    await putOne('cyclics',cyc); await refresh(); scheduleAutoUpload();
    renderCyclicReport(cyc.id);
  });
}

function renderCyclicReport(id){
  var cyc=getCyclic(id); if(!cyc) return;
  currentCyclicId=id; currentView='cyclicReport';
  document.getElementById('backBtn').style.display='flex';
  document.querySelectorAll('nav.bottom .tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('topTitle').textContent='Reporte de cíclico';
  document.getElementById('topSub').textContent=fmtDate(cyc.date)+' · '+escapeHtml(cyc.employee||'');
  var items=cyc.items||[];
  var checked=items.filter(function(it){return it.checked;});
  var checkedIds={}; checked.forEach(function(it){checkedIds[it.productId]=1;});
  var pendientes=products.filter(function(p){return !checkedIds[p.id];});
  var diffs=checked.filter(function(it){return Math.abs(it.discrepancy||0)>0.01;});
  var diffTotal=diffs.reduce(function(s,it){return s+(it.discrepancy||0);},0);
  var expiredNow=alertLots().filter(function(a){return a.status==='expired';}).length;
  var h='';
  h+='<div class="kpis" style="grid-template-columns:1fr 1fr;margin-top:14px">';
  h+='<div class="kpi"><div class="n">'+checked.length+'/'+products.length+'</div><div class="l">Productos revisados</div></div>';
  h+='<div class="kpi '+(pendientes.length?'warn':'')+'"><div class="n" style="color:'+(pendientes.length?'var(--warn)':'var(--text)')+'">'+pendientes.length+'</div><div class="l">Pendientes</div></div>';
  h+='<div class="kpi '+(diffs.length?'danger':'')+'"><div class="n" style="color:'+(diffs.length?'var(--danger)':'var(--text)')+'">'+diffs.length+'</div><div class="l">Con diferencia</div></div>';
  h+='<div class="kpi"><div class="n" style="font-size:20px">'+(diffTotal>0?'+':'')+fmtQty(diffTotal)+'</div><div class="l">Diferencia neta (unid.)</div></div>';
  h+='</div>';
  if(cyc.ticketPhoto) h+='<div style="margin-top:12px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)"><img src="'+cyc.ticketPhoto+'" style="width:100%;display:block;cursor:zoom-in" id="ticketPhotoView" alt="Ticket del cíclico"></div>';
  h+='<div class="btn-row"><button class="btn primary" id="shareReport">Compartir resumen</button><button class="btn ghost" id="csvReport">Exportar CSV</button></div>';
  if(cyc.status==='open') h+='<div class="btn-row"><button class="btn primary2" id="resumeVerify">Continuar verificando</button></div>';
  if(pendientes.length){
    h+='<div class="section-title"><h2>Pendientes ('+pendientes.length+')</h2></div><div class="card">';
    pendientes.forEach(function(p){ h+='<div class="lotrow" data-vpid="'+p.id+'"><div><div class="date">'+escapeHtml(p.name)+'</div><div class="days">'+(p.barcode? '#'+escapeHtml(p.barcode):'Sin código')+' · stock app: '+fmtQty(totalQty(p.id))+'</div></div><span class="pill soon">Pendiente</span></div>'; });
    h+='</div>';
  }
  if(diffs.length){
    h+='<div class="section-title"><h2>Con diferencia ('+diffs.length+')</h2></div><div class="card">';
    diffs.sort(function(a,b){return Math.abs(b.discrepancy)-Math.abs(a.discrepancy);}).forEach(function(it){
      h+='<div class="lotrow"><div><div class="date">'+escapeHtml(it.name)+'</div><div class="days">'+(it.barcode?'#'+escapeHtml(it.barcode)+' · ':'')+'registrado '+fmtQty(it.recordedTotal)+' / contado '+fmtQty(it.countedTotal)+'</div></div><div class="qty" style="color:'+(it.discrepancy>0?'var(--ok)':'var(--danger)')+'">'+(it.discrepancy>0?'+':'')+fmtQty(it.discrepancy)+'</div></div>';
    });
    h+='</div>';
  }
  if(expiredNow>0) h+='<p class="muted" style="margin-top:14px">Lotes caducados actualmente en el inventario: <strong style="color:var(--danger)">'+expiredNow+'</strong> (ver Inicio).</p>';
  main.innerHTML=h;
  var tpv=document.getElementById('ticketPhotoView'); if(tpv) tpv.onclick=function(){ openViewer(cyc.ticketPhoto,'Ticket del cíclico'); };
  document.getElementById('shareReport').onclick=function(){ shareCyclicReport(cyc); };
  document.getElementById('csvReport').onclick=function(){ exportCyclicCSV(cyc); };
  var rv=document.getElementById('resumeVerify'); if(rv) rv.onclick=function(){ startCyclic(cyc.id); };
  main.querySelectorAll('[data-vpid]').forEach(function(el){ if(cyc.status==='open') el.onclick=function(){ verifyProduct(el.getAttribute('data-vpid')); }; });
  window.scrollTo(0,0);
}

function buildCyclicText(cyc){
  var items=cyc.items||[];
  var checked=items.filter(function(it){return it.checked;});
  var checkedIds={}; checked.forEach(function(it){checkedIds[it.productId]=1;});
  var pendientes=products.filter(function(p){return !checkedIds[p.id];});
  var diffs=checked.filter(function(it){return Math.abs(it.discrepancy||0)>0.01;});
  var t='CÍCLICO DE INVENTARIO\nFecha: '+fmtDate(cyc.date)+'\nEmpleado: '+(cyc.employee||'')+'\nRevisados: '+checked.length+'/'+products.length+' | Pendientes: '+pendientes.length+'\n\n';
  if(diffs.length){ t+='CON DIFERENCIA:\n'; diffs.forEach(function(it){ t+='- '+it.name+' ('+(it.barcode||'sin código')+'): registrado '+fmtQty(it.recordedTotal)+', contado '+fmtQty(it.countedTotal)+' ('+(it.discrepancy>0?'+':'')+fmtQty(it.discrepancy)+')\n'; }); t+='\n'; }
  if(pendientes.length){ t+='PENDIENTES DE ESCANEAR:\n'; pendientes.forEach(function(p){ t+='- '+p.name+(p.barcode?' ('+p.barcode+')':'')+'\n'; }); }
  if(!diffs.length && !pendientes.length) t+='Todo el inventario coincide. Sin diferencias.\n';
  return t;
}
function shareCyclicReport(cyc){
  var text=buildCyclicText(cyc);
  if(navigator.share){ navigator.share({title:'Reporte de cíclico '+fmtDate(cyc.date), text:text}).catch(function(){}); }
  else {
    var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Resumen copiado al portapapeles'); }catch(e){ navigator.clipboard.writeText(text).then(function(){toast('Resumen copiado');}).catch(function(){toast('Selecciona y copia manualmente');}); }
    ta.remove();
  }
}
function exportCyclicCSV(cyc){
  var rows=[['Producto','CodigoBarra','Categoria','Registrado','Contado','Diferencia','Estatus']];
  var items=cyc.items||[]; var byPid={}; items.forEach(function(it){byPid[it.productId]=it;});
  products.forEach(function(p){
    var it=byPid[p.id];
    if(it && it.checked) rows.push([it.name, it.barcode||'', it.category||'', it.recordedTotal, it.countedTotal, it.discrepancy, Math.abs(it.discrepancy)>0.01?'DIFERENCIA':'OK']);
    else rows.push([p.name, p.barcode||'', p.category||'', totalQty(p.id), '', '', 'PENDIENTE']);
  });
  var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ciclico-'+(cyc.date||todayISO())+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('CSV descargado');
}

  showView('home');
}).catch(function(err){
  main.innerHTML='<div class="empty"><p><strong>Error al iniciar la base de datos</strong></p><p>'+escapeHtml(err&&err.message?err.message:String(err))+'</p></div>';
});

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
