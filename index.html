<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle-K — Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --primario: #ffcc00; --ok: #2e7d32; --warn: #f57c00; --peligro: #d32f2f; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f8f9fa; margin: 0; padding-bottom: 80px; }

        #pantallaAcceso {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .tarjeta-acceso {
            background: white; padding: 2.5rem; border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1); width: 100%; max-width: 420px;
        }
        .tarjeta-acceso h1 { text-align: center; margin-bottom: 2rem; font-size: 1.7rem; }
        .tarjeta-acceso input {
            width: 100%; padding: 0.9rem; margin-bottom: 1rem;
            border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;
        }
        .btn-entrar {
            width: 100%; padding: 1rem; background: var(--primario);
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; color: #000;
        }
        .btn-entrar:hover { background: #ffb900; }
        #mensajeAcceso { margin-top: 1rem; text-align: center; font-weight: 500; min-height: 2rem; }
        .texto-error { color: var(--peligro); }
        .texto-ok { color: var(--ok); }

        #pantallaInventario { display: none; }
        .alerta-vencimiento { background: #fff3e0; border-left: 4px solid var(--warn); }
        .alerta-stock { background: #ffebee; border-left: 4px solid var(--peligro); }
        .card { border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 1rem; }
        #lector { max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body>

<div id="pantallaAcceso">
    <div class="tarjeta-acceso">
        <h1>🔐 Acceso — Circle-K</h1>
        <input type="email" id="correo" value="xavidgeffen@gmail.com">
        <input type="password" id="clave" placeholder="Escribe tu contraseña">
        <button class="btn-entrar" onclick="validarAhora()">Entrar</button>
        <div id="mensajeAcceso"></div>
        <p class="text-center text-muted small mt-3">Solo personal autorizado</p>
    </div>
</div>

<div id="pantallaInventario">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="navbar-brand mb-0 fs-4">📦 Inventario Circle-K</h1>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
        </div>
    </nav>

    <div class="container">
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#lista">Lista</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#agregar">Agregar</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#escanear">Escanear</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="lista">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <input type="text" id="buscar" class="form-control" placeholder="🔍 Buscar producto...">
                    </div>
                    <div class="col-md-4">
                        <select id="filtro" class="form-select">
                            <option value="todos">Todos los productos</option>
                            <option value="bajo">Stock bajo</option>
                            <option value="vencen">Por caducar</option>
                        </select>
                    </div>
                </div>
                <div id="contenedorLista"></div>
            </div>

            <div class="tab-pane fade" id="agregar">
                <div class="card p-3">
                    <h5 class="mb-3">➕ Nuevo Producto</h5>
                    <form onsubmit="guardarProducto(event)">
                        <div class="mb-2">
                            <label class="form-label">Código de barras</label>
                            <input type="text" id="codigo" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option>Bebidas</option>
                                <option>Alimentos</option>
                                <option>Snacks</option>
                                <option>Limpieza</option>
                                <option>Higiene</option>
                                <option>Otros</option>
                            </select>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <label class="form-label">Cantidad</label>
                                <input type="number" id="cantidad" class="form-control" min="0" required>
                            </div>
                            <div class="col">
                                <label class="form-label">Precio ($ MXN)</label>
                                <input type="number" id="precio" class="form-control" step="0.01" min="0" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Fecha de entrada</label>
                                <input type="date" id="fechaEntrada" class="form-control">
                            </div>
                            <div class="col">
                                <label class="form-label">Fecha de caducidad</label>
                                <input type="date" id="fechaCaducidad" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>

            <div class="tab-pane fade" id="escanear">
                <div class="card p-3 text-center">
                    <h5 class="mb-3">📷 Escanear Código</h5>
                    <div id="lector"></div>
                    <button class="btn btn-primary mt-2" id="btnCamara" onclick="iniciarCamara()">Activar Cámara</button>
                    <button class="btn btn-secondary mt-2 d-none" id="btnDetenerCamara" onclick="detenerCamara()">Detener</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const CORREO_OK = 'xavidgeffen@gmail.com';
const PASS_OK = 'Geffen$666&';

// PEGA TUS DATOS DE SUPABASE AQUÍ 👇
const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
const SUPABASE_KEY = 'TU-CLAVE-ANON';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const UMBRAL_STOCK = 5;
const DIAS_AVISO = 7;
let inventario = [];
let lectorCamara = null;

// Sesión
if (localStorage.getItem('circlek_acceso') === 'si') {
    mostrarPantallaInventario();
}

function validarAhora() {
    const correo = document.getElementById('correo').value.trim();
    const clave = document.getElementById('clave').value;
    const msj = document.getElementById('mensajeAcceso');

    if (!correo || !clave) {
        msj.className = 'texto-error';
        msj.textContent = '⚠️ Escribe la contraseña';
        return;
    }

    if (correo === CORREO_OK && clave === PASS_OK) {
        msj.className = 'texto-ok';
        msj.textContent = '✅ Acceso concedido — Cargando...';
        localStorage.setItem('circlek_acceso', 'si');
        setTimeout(mostrarPantallaInventario, 500);
    } else {
        msj.className = 'texto-error';
        msj.textContent = '❌ Contraseña incorrecta';
        document.getElementById('clave').value = '';
    }
}

function mostrarPantallaInventario() {
    document.getElementById('pantallaAcceso').style.display = 'none';
    document.getElementById('pantallaInventario').style.display = 'block';
    document.getElementById('fechaEntrada').valueAsDate = new Date();
    cargarProductos();
}

function cerrarSesion() {
    localStorage.removeItem('circlek_acceso');
    location.reload();
}

// Cargar productos
async function cargarProductos() {
    const { data, error } = await supabase
        .from('productos')
        .select('*')
        .order('created_at', { ascending: false });

    inventario = error ? [] : (data || []);
    renderizarLista();
}

// Guardar producto
async function guardarProducto(e) {
    e.preventDefault();
    const codigo = document.getElementById('codigo').value.trim();
    
    const datos = {
        codigo,
        nombre: document.getElementById('nombre').value.trim(),
        categoria: document.getElementById('categoria').value,
        cantidad: parseInt(document.getElementById('cantidad').value),
        precio: parseFloat(document.getElementById('precio').value),
        fecha_entrada: document.getElementById('fechaEntrada').value,
        fecha_caducidad: document.getElementById('fechaCaducidad').value
    };

    const existe = inventario.find(p => p.codigo === codigo);
    const { error } = existe
        ? await supabase.from('productos').update(datos).eq('codigo', codigo)
        : await supabase.from('productos').insert(datos);

    if (error) { alert('Error: ' + error.message); return; }

    alert(existe ? '✅ Actualizado' : '✅ Agregado');
    e.target.reset();
    document.getElementById('fechaEntrada').valueAsDate = new Date();
    cargarProductos();
}

function diasRestantes(fecha) {
    if (!fecha) return null;
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const cad = new Date(fecha);
    return Math.ceil((cad - hoy) / (1000*60*60*24));
}

function formatoMonto(cantidad) {
    return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(cantidad);
}

function renderizarLista() {
    const buscar = document.getElementById('buscar').value.toLowerCase();
    const filtro = document.getElementById('filtro').value;

    const filtrados = inventario.filter(p => {
        const coincide = p.nombre.toLowerCase().includes(buscar) || p.codigo.includes(buscar);
        if (!coincide) return false;
        if (filtro === 'bajo') return p.cantidad <= UMBRAL_STOCK;
        if (filtro === 'vencen') {
            const dr = diasRestantes(p.fecha_caducidad);
            return dr !== null && dr <= DIAS_AVISO && dr >= 0;
        }
        return true;
    });

    const contenedor = document.getElementById('contenedorLista');
    if (!filtrados.length) {
        contenedor.innerHTML = '<p class="text-center text-muted mt-4">No hay productos registrados</p>';
        return;
    }

    contenedor.innerHTML = filtrados.map(p => {
        const dr = diasRestantes(p.fecha_caducidad);
        let clases = '', etiquetas = '';
        if (p.cantidad <= UMBRAL_STOCK) {
            clases += ' alerta-stock';
            etiquetas += `<span class="badge bg-danger me-1">Stock bajo</span>`;
        }
        if (dr !== null && dr <= DIAS_AVISO && dr >= 0) {
            clases += ' alerta-vencimiento';
            etiquetas += `<span class="badge bg-warning text-dark">Vence en ${dr} días</span>`;
        }
        if (dr !== null && dr < 0) {
            clases += ' alerta-stock';
            etiquetas += `<span class="badge bg-dark">Vencido hace ${Math.abs(dr)} días</span>`;
        }

        return `
        <div class="card p-3${clases}">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h6 class="mb-1">${p.nombre}</h6>
                    <p class="small text-muted mb-1">Código: ${p.codigo} · ${p.categoria}</p>
                    <p class="mb-1">Cantidad: ${p.cantidad} · Precio: ${formatoMonto(p.precio)}</p>
                    ${etiquetas}
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto('${p.codigo}')">🗑️</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

async function eliminarProducto(codigo) {
    if (!confirm('¿Eliminar este producto?')) return;
    const { error } = await supabase.from('productos').delete().eq('codigo', codigo);
    if (error) { alert('Error: ' + error.message); return; }
    alert('✅ Producto eliminado');
    cargarProductos();
}

function iniciarCamara() {
    if (!lectorCamara) {
        lectorCamara = new Html5Qrcode('lector');
    }
    lectorCamara.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 120 } },
        (texto) => {
            lectorCamara.stop();
            document.getElementById('codigo').value = texto;
            new bootstrap.Tab(document.querySelector('[data-bs-target="#agregar"]')).show();
            alert('✅ Código leído: ' + texto);
        },
        () => {}
    ).then(() => {
        document.getElementById('btnCamara').classList.add('d-none');
        document.getElementById('btnDetenerCamara').classList.remove('d-none');
    }).catch(err => {
        alert('❌ No se pudo acceder a la cámara: ' + err);
    });
}

function detenerCamara() {
    if (lectorCamara) {
        lectorCamara.stop().then(() => {
            document.getElementById('btnCamara').classList.remove('d-none');
            document.getElementById('btnDetenerCamara').classList.add('d-none');
        });
    }
}
</script>

</body>
</html>
